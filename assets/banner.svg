<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#311042" />
    </linearGradient>

    <!-- Vibrant Accents -->
    <linearGradient id="accent-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="accent-grad-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>

    <!-- Grid Pattern for EdTech vibe -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)" />
  <rect width="1200" height="400" fill="url(#grid)" />

  <!-- Abstract Dynamic Shapes -->
  <!-- Glowing blob 1 -->
  <circle cx="200" cy="100" r="120" fill="url(#accent-grad-1)" opacity="0.15" filter="url(#glow)" />
  <!-- Glowing blob 2 -->
  <circle cx="1000" cy="300" r="150" fill="url(#accent-grad-2)" opacity="0.12" filter="url(#glow)" />

  <!-- Animated-like wavy curves -->
  <path d="M-100 250 C 300 50, 400 350, 800 150 C 1000 50, 1100 300, 1300 200" fill="none" stroke="url(#accent-grad-1)" stroke-width="4" opacity="0.4" />
  <path d="M-100 270 C 300 70, 400 370, 800 170 C 1000 70, 1100 320, 1300 220" fill="none" stroke="url(#accent-grad-2)" stroke-width="2" opacity="0.3" />

  <!-- Tech/Academic Icons floating -->
  <!-- Book Outline -->
  <g transform="translate(150, 260) scale(1.5)" opacity="0.6" stroke="url(#accent-grad-1)" stroke-width="2" fill="none">
    <path d="M 4 20 L 4 4 C 4 3 6 2 12 2 C 18 2 20 3 20 4 L 20 20 C 20 19 18 18 12 18 C 6 18 4 19 4 20 Z" />
    <path d="M 12 2 L 12 18" />
  </g>
  
  <!-- Graduation Cap -->
  <g transform="translate(980, 80) scale(1.8)" opacity="0.5" stroke="url(#accent-grad-2)" stroke-width="2" fill="none">
    <polygon points="12,2 22,7 12,12 2,7" />
    <path d="M 6,9 L 6,17 C 6,19 8,21 12,21 C 16,21 18,19 18,17 L 18,9" />
    <line x1="22" y1="7" x2="22" y2="14" />
  </g>

  <!-- Central Typography -->
  <g text-anchor="middle" font-family="'Outfit', 'Inter', system-ui, sans-serif">
    <!-- Subtitle/Category -->
    <text x="600" y="160" fill="#38bdf8" font-size="18" font-weight="600" letter-spacing="6" opacity="0.9">CURATED LIST OF PLATFORMS</text>
    
    <!-- Main Title with Glow -->
    <text x="600" y="230" fill="#ffffff" font-size="64" font-weight="800" letter-spacing="2" filter="drop-shadow(0px 4px 12px rgba(56, 189, 248, 0.3))">
      Awesome Lesson Planning
    </text>

    <!-- Subtext -->
    <text x="600" y="275" fill="#94a3b8" font-size="16" font-weight="400" letter-spacing="1">
      Open-Source &amp; SaaS Solutions for Teachers &amp; Schools
    </text>
  </g>

  <!-- Interactive/Dynamic visual lines representing planning structure -->
  <g opacity="0.3" stroke="#ffffff" stroke-width="1">
    <line x1="450" y1="310" x2="750" y2="310" stroke-dasharray="5 5" />
    <circle cx="450" cy="310" r="3" fill="#38bdf8" />
    <circle cx="600" cy="310" r="4" fill="#f43f5e" />
    <circle cx="750" cy="310" r="3" fill="#38bdf8" />
  </g>
</svg>
